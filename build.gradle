plugins {
    id 'base'
    alias(libs.plugins.maven.publish) apply false
    alias(libs.plugins.nullmarked) apply false
}

allprojects {
    group = 'top.swiftx.framework'
    version = providers.gradleProperty('frameworkVersion').get()
}

def springBootBom = libs.spring.boot.bom

configure([project(':framework-rest'), project(':framework-problem'), project(':framework-storage')]) {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'io.github.malczuuu.nullmarked'
    apply plugin: 'com.vanniktech.maven.publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    nullmarked {
        sourceSet('test')
    }

    dependencies {
        api platform(springBootBom)
        api 'org.springframework.boot:spring-boot-autoconfigure'
        api 'org.jspecify:jspecify'
        implementation 'org.slf4j:slf4j-api'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor platform(springBootBom)
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:all,-missing', true)
    }

    jacoco {
        toolVersion = '0.8.15'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy 'jacocoTestReport'
    }

    tasks.named('jacocoTestReport') {
        reports.xml.required = true
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom {
            name = project.name
            url = 'https://github.com/Swiftx/framework'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/license/mit'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'Swiftx'
                    name = '胡永强'
                    url = 'https://github.com/Swiftx'
                }
            }
            scm {
                connection = 'scm:git:https://github.com/Swiftx/framework.git'
                developerConnection = 'scm:git:ssh://git@github.com/Swiftx/framework.git'
                url = 'https://github.com/Swiftx/framework'
            }
        }
    }
}
